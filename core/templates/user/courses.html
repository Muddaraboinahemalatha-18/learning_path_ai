<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Courses | AI Learning Platform</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }
        .card {
            border-radius: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        }
        .navbar-brand {
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">AI Learning</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="{% url 'courses' %}">Courses</a>
                </li>
                
                <li class="nav-item">
                    <a class="btn btn-outline-light ms-2" href="{% url 'login' %}">
                        Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ================= COURSES SECTION ================= -->
<div class="container mt-5">

    <h2 class="mb-4 text-center fw-bold">Available Courses</h2>

    <div class="row">
        {% for course in courses %}
        <div class="col-md-4">
            <div class="card shadow p-4 mb-4 text-center">
                <h4 class="fw-semibold">{{ course.course_name }}</h4>
                <p class="text-muted mt-2">
                    {{ course.description }}
                </p>

                <a href="{% url 'enroll' course.id %}" class="btn btn-primary w-100 mt-3">
                    Enroll Now
                </a>
                <li class="nav-item">
                    <a href="{% url 'scoreboard' course.id %}">scoreboard</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'feedback' course.id %}">Feedback</a>
                </li>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center text-muted">
            No courses available
        </div>
        {% endfor %}
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
