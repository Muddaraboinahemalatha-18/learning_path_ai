<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assessment</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .question-card {
            border-radius: 15px;
            transition: 0.3s ease;
        }

        .question-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }

        .option-box {
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option-box:hover {
            background-color: #eef2ff;
        }

        .submit-bar {
            position: sticky;
            bottom: 0;
            background: #fff;
            padding: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand fw-bold">
            📝 Assessment
        </span>
    </div>
</nav>

<!-- ASSESSMENT CONTENT -->
<div class="container mt-5 mb-5">

    <h2 class="text-center text-white fw-bold mb-4">
        Assessment
    </h2>

    <form method="post" action="{% url 'submit_assessment' assessment.id %}">
        {% csrf_token %}

        {% for q in questions %}
        <div class="card question-card shadow p-4 mb-4">

            <h5 class="fw-semibold mb-3">
                {{ forloop.counter }}. {{ q.question_text }}
            </h5>

            <div class="form-check option-box mb-2">
                <input class="form-check-input" type="radio" name="{{ q.id }}" value="A" required>
                <label class="form-check-label">
                    {{ q.option_a }}
                </label>
            </div>

            <div class="form-check option-box mb-2">
                <input class="form-check-input" type="radio" name="{{ q.id }}" value="B">
                <label class="form-check-label">
                    {{ q.option_b }}
                </label>
            </div>

            <div class="form-check option-box mb-2">
                <input class="form-check-input" type="radio" name="{{ q.id }}" value="C">
                <label class="form-check-label">
                    {{ q.option_c }}
                </label>
            </div>

            <div class="form-check option-box">
                <input class="form-check-input" type="radio" name="{{ q.id }}" value="D">
                <label class="form-check-label">
                    {{ q.option_d }}
                </label>
            </div>

        </div>
        {% endfor %}

        <!-- SUBMIT BAR -->
        <div class="submit-bar text-center">
            <button type="submit" class="btn btn-success btn-lg px-5">
                Submit Assessment
            </button>
        </div>

    </form>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
