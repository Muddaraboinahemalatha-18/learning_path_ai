<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ course.course_name }} | Topics</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .card {
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        .locked {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .locked:hover {
            transform: none;
            box-shadow: none;
        }

        .topic-icon {
            font-size: 32px;
        }
    </style>
</head>
<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'courses' %}">
            AI Learning
        </a>

        <div class="ms-auto">
            <a href="{% url 'courses' %}" class="btn btn-outline-light btn-sm">
                Back to Courses
            </a>
        </div>
    </div>
</nav>

<!-- ================= TOPICS ================= -->
<div class="container mt-5">

    <h2 class="text-center fw-bold mb-4">
        {{ course.course_name }} – Topics
    </h2>

    <div class="row">
        {% for topic, unlocked in topics %}
        <div class="col-md-4 mb-4">

            {% if unlocked %}
            <!-- UNLOCKED TOPIC -->
            <a href="{% url 'topic_content' topic.id %}" class="text-decoration-none text-dark">
                <div class="card shadow p-4 text-center">
                    <div class="topic-icon text-success mb-2">
                        <i class="bi bi-unlock-fill"></i>
                    </div>
                    <h5 class="fw-semibold">{{ topic.topic_title }}</h5>
                    <p class="text-muted mt-2">Click to start learning</p>
                </div>
            </a>
            {% else %}
            <!-- LOCKED TOPIC -->
            <div class="card shadow p-4 text-center locked">
                <div class="topic-icon text-danger mb-2">
                    <i class="bi bi-lock-fill"></i>
                </div>
                <h5 class="fw-semibold">{{ topic.topic_title }}</h5>
                <p class="text-muted mt-2">Complete previous topic to unlock</p>
            </div>
            {% endif %}

        </div>
        {% endfor %}
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
