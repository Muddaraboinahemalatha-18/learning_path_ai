<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate Generated</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .certificate-card {
            border-radius: 25px;
            animation: fadeIn 0.9s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .badge-icon {
            font-size: 60px;
            color: #198754;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand fw-bold">🎓 Certificate</span>
    </div>
</nav>

<!-- CERTIFICATE CONTENT -->
<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="col-md-6">
        <div class="card certificate-card shadow-lg p-5 text-center">

            <div class="badge-icon mb-3">
                <i class="bi bi-patch-check-fill"></i>
            </div>

            <h2 class="fw-bold text-success mb-3">
                Certificate Generated Successfully
            </h2>

            <p class="lead">
                Congratulations! You have successfully completed the course.
            </p>

            <p class="text-muted">
                <b>Certificate ID:</b> {{ certificate.certificate_id }}
            </p>

            <a href="/certificates/{{ certificate.certificate_id }}.pdf"
               target="_blank"
               class="btn btn-success btn-lg mt-3 px-5">
                Download Certificate
            </a>

            <div class="mt-4">
                <a href="{% url 'courses' %}" class="text-decoration-none">
                    ← Back to Courses
                </a>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
