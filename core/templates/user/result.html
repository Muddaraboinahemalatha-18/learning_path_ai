<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assessment Result</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .result-card {
            border-radius: 20px;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto;
        }

        .success {
            background: #e6fffa;
            color: #198754;
        }

        .fail {
            background: #ffe6e6;
            color: #dc3545;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand fw-bold">Assessment Result</span>
    </div>
</nav>

<!-- RESULT CONTENT -->
<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="col-md-6">
        <div class="card result-card shadow-lg p-5 text-center">

            {% if passed %}
                <div class="score-circle success mb-4">
                    {{ percentage }}%
                </div>

                <h3 class="text-success fw-bold mb-2">🎉 Congratulations!</h3>
                <p class="lead">
                    You successfully completed <b>{{ assessment }}</b>
                </p>

                <p class="text-muted">
                    Score: {{ score }}/10
                </p>

                <a href="{% url 'topics' assessment.topic.course.id %}"
                   class="btn btn-success btn-lg mt-3 px-4">
                    Learn Next Topic →
                </a>

            {% else %}
                <div class="score-circle fail mb-4">
                    {{ percentage }}%
                </div>

                <h3 class="text-danger fw-bold mb-2">❌ Oops!</h3>
                <p class="lead">
                    You did not pass this assessment.
                </p>

                <p class="text-muted">
                    Score: {{ score }}/10
                </p>

                <a href="{% url 'start_assessment' assessment.id %}"
                   class="btn btn-danger btn-lg mt-3 px-4">
                    Retry Assessment
                </a>
            {% endif %}

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
