<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Topics | Admin</title>

    <!-- ✅ Bootstrap CSS (FIXED) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }
        .card {
            border-radius: 15px;
        }
        .navbar-brand {
            font-weight: bold;
            letter-spacing: 1px;
        }
        .table th, .table td {
            vertical-align: middle;
        }
    </style>
</head>
<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">Admin – Manage Topics</span>
        <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-light btn-sm">
            Back
        </a>
    </div>
</nav>

<!-- ================= CONTENT ================= -->
<div class="container mt-5">
    <div class="card shadow p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">Topics List</h4>
            <a href="{% url 'add_topic' %}" class="btn btn-primary btn-sm">
                + Add Topic
            </a>
        </div>

        {% if topics %}
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th style="width: 8%;">#</th>
                    <th>Course</th>
                    <th>Topic Title</th>
                    <th style="width: 18%;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for t in topics %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ t.course.course_name }}</td>
                    <td>{{ t.topic_title }}</td>
                    <td>
                        <a href="{% url 'delete_topic' t.id %}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this topic?')">
                            Delete
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
            <p class="text-muted text-center mb-0">No topics available.</p>
        {% endif %}

    </div>
</div>

</body>
</html>
