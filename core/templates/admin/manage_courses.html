<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Courses | Admin</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }
        .card {
            border-radius: 15px;
        }
        .navbar-brand {
            font-weight: bold;
            letter-spacing: 1px;
        }
        .table th, .table td {
            vertical-align: middle;
        }
    </style>
</head>
<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">Admin – Manage Courses</span>
        <div>
            <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-light btn-sm">
                Back
            </a>
        </div>
    </div>
</nav>

<!-- ================= CONTENT ================= -->
<div class="container mt-5">
    <div class="card shadow p-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Courses List</h4>
            <a href="{% url 'add_course' %}" class="btn btn-primary btn-sm">
                + Add Course
            </a>
        </div>

        {% if courses %}
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th style="width: 10%;">#</th>
                    <th>Course Name</th>
                    <th style="width: 20%;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for c in courses %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ c.course_name }}</td>
                    <td>
                        <a href="{% url 'delete_course' c.id %}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this course?')">
                            Delete
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
            <p class="text-muted text-center mb-0">No courses available.</p>
        {% endif %}

    </div>
</div>

</body>
</html>
