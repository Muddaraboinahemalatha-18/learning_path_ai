<!DOCTYPE html>
<html>
<head>
    <title>Add Questions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">Admin - Add Questions</span>
        <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-light btn-sm">Back</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow p-4">

        <h4 class="mb-3">Add MCQ Question</h4>

        {% if success %}
            <div class="alert alert-success">{{ success }}</div>
        {% endif %}

        <!-- STEP 1: SELECT COURSE -->
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label>Select Course</label>
                <select name="course" class="form-control" onchange="this.form.submit()" required>
                    <option value="">-- Select Course --</option>
                    {% for c in courses %}
                        <option value="{{ c.id }}"
                            {% if selected_course and selected_course.id == c.id %}selected{% endif %}
                        >
                            {{ c.course_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </form>

        {% if selected_course %}
        <!-- COURSE LABEL -->
        <div class="alert alert-info">
            Selected Course: <strong>{{ selected_course.course_name }}</strong>
        </div>

        <!-- STEP 2: ADD QUESTION -->
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="course" value="{{ selected_course.id }}">

            <div class="mb-3">
                <label>Select Assessment ({{ selected_course.course_name }} Topics)</label>
                <select name="assessment" class="form-control" required>
                    {% for a in assessments %}
                        <option value="{{ a.id }}">
                            {{ a.topic.topic_title }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label>Question</label>
                <textarea name="question_text" class="form-control" required></textarea>
            </div>

            <input type="text" name="option_a" placeholder="Option A" class="form-control mb-2" required>
            <input type="text" name="option_b" placeholder="Option B" class="form-control mb-2" required>
            <input type="text" name="option_c" placeholder="Option C" class="form-control mb-2" required>
            <input type="text" name="option_d" placeholder="Option D" class="form-control mb-2" required>

            <div class="mb-3">
                <label>Correct Option</label>
                <select name="correct_option" class="form-control">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
            </div>

            <button class="btn btn-success w-100">
                Add Question
            </button>
        </form>
        {% endif %}

    </div>
</div>

</body>
</html>
